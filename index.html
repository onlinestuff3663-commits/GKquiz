<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exam Quiz Trainer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#faf9f7;--fg:#1f1d1a;--mut:#6b675f;--card:#fff;--bd:#e0dbd2;--ac:#c2410c;--ok:#166534;--okb:#dcfce7;--no:#991b1b;--nob:#fee2e2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1917;--fg:#ece9e2;--mut:#a09b90;--card:#262421;--bd:#3a3733;--ac:#fb923c;--ok:#86efac;--okb:#14351f;--no:#fca5a5;--nob:#401717;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1917;--fg:#ece9e2;--mut:#a09b90;--card:#262421;--bd:#3a3733;--ac:#fb923c;--ok:#86efac;--okb:#14351f;--no:#fca5a5;--nob:#401717;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
#app{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 14px}h2{font-size:18px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.mut{color:var(--mut);font-size:14px}
button,.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:10px;padding:10px 14px;cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

textarea{min-height:90px}
.opt{display:block;width:100%;text-align:left;margin-top:8px;padding:12px}
.opt.ok{background:var(--okb);border-color:var(--ok);color:var(--ok)}
.opt.no{background:var(--nob);border-color:var(--no);color:var(--no)}

ul.f{padding-left:18px;max-height:260px;overflow:auto;font-size:14px}
</style></head><body><div id="app">Loading…</div>
<script>
const app=document.getElementById('app');
let db,sample,col,bcol,uid,topics={},S=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid8=()=>Math.random().toString(36).slice(2,9);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
async function init(){
  try{col=mkcol('topics');bcol=mkcol('bank');(await col.get()).docs.forEach(d=>topics[d.id]=d.data());if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){console.error(e);col=null}
  sample=mkSample();home();
}
async function save(id){if(!col)return;try{await col.doc(id).set(topics[id])}catch(e){console.error(e)}}
const BANK={};
function toast(m){const d=document.createElement('div');d.className='warn';d.textContent=m;app.prepend(d);setTimeout(()=>d.remove(),4500)}
async function loadBank(id){
  if(BANK[id])return BANK[id];const m={},T=topics[id];
  if(bcol)for(let k=0;k<(T.bn||0);k++){try{const d=await bcol.doc(id+'_'+k).get();if(d.exists){const mm=d.data().m||{};for(const i in mm)m[i]=mm[i]}}catch(e){console.error(e)}}
  return BANK[id]=m;
}
async function saveChunk(id,k){
  const B=BANK[id],m={};for(const i in B)if(Math.floor(i/40)===k)m[i]=B[i];
  if(bcol)try{await bcol.doc(id+'_'+k).set({m})}catch(e){console.error(e)}
  const T=topics[id];T.bn=Math.max(T.bn||0,k+1);T.bk=Object.keys(B).filter(i=>B[i].length>=4).length;await save(id);
}
async function build(ids){
  if(!sample){toast('Add a free Gemini key (or Claude key) in Settings to build AI-written questions.');return}
  STOP=0;
  app.innerHTML='<h1>Building question bank</h1><div class="bar"><div id="bp" style="width:0"></div></div><div id="bs" class="mut">Starting…</div><div class="row"><button onclick="STOP=1">Stop &amp; save</button></div><p class="mut">Keep this page open. Whatever is finished is saved as it goes, so you can stop and resume later.</p>';
  const todo=[];
  for(const id of ids){const B=await loadBank(id);topics[id].facts.forEach((f,i)=>{if((B[i]||[]).length<4)todo.push({id,i})})}
  let p=0,done=0,fail=0;
  while(p<todo.length&&!STOP){
    const id=todo[p].id,grp=[];
    while(p<todo.length&&todo[p].id===id&&grp.length<8)grp.push(todo[p++]);
    document.getElementById('bs').textContent=`${done} of ${todo.length} facts done · ${topics[id].name}`;
    const T=topics[id],B=BANK[id],seed=Math.random().toString(36).slice(2,6);
    const pr=`You are a tough exam-paper setter for Indian competitive exams. For each numbered fact write 4 DIFFERENT multiple-choice questions that each test exactly that fact. Difficulty mix per fact: one easy, two medium, one hard. Make them genuinely different: vary the wording, the angle and the style (direct recall; "which is NOT / incorrect" twist; assertion to judge; fill in the blank using ____; scenario-based; reverse question asking for the name/place/number). At least one of the four must be fill-in-the-blank. Each question has exactly 4 options. Distractors must be plausible and close to the right answer (same category, similar names, dates, numbers, places), different in each of the 4 questions, never obviously wrong; only one option is correct. "e" is a 2-3 sentence explanation: state the correct fact fully and briefly say why the closest wrong options are wrong. Seed: ${seed}. Return ONLY JSON: [{"i":<fact number>,"qs":[{"q":"...","o":["..","..","..",".."],"a":<index 0-3>,"e":"..."}]}]\n\nFACTS:\n`+grp.map((g,k)=>`${k+1}. ${T.facts[g.i].t}`).join('\n');
    let ok=false;
    for(let t=0;t<2&&!ok;t++){try{
      const r=await sample.json(pr,{cache:false});
      r.forEach(x=>{const g=grp[x.i-1];if(!g||!Array.isArray(x.qs))return;
        const v=x.qs.filter(q=>q&&Array.isArray(q.o)&&q.o.length===4&&q.a>=0&&q.a<4&&q.q);
        if(v.length)B[g.i]=(B[g.i]||[]).concat(v.map(q=>({q:q.q,o:q.o,a:q.a,e:q.e||''})))});
      ok=true}catch(e){console.error(e)}}
    if(!ok)fail+=grp.length;
    done+=grp.length;
    for(const k of new Set(grp.map(g=>Math.floor(g.i/40))))await saveChunk(id,k);
    document.getElementById('bp').style.width=(100*done/todo.length)+'%';
  }
  app.innerHTML=`<h1>${STOP?'Stopped':'Done'}</h1><div class="card">${done} of ${todo.length} facts processed.${fail?' '+fail+' failed; run Build again to retry them.':''}${STOP&&done<todo.length?' Press Build again anytime to continue.':''}</div><button class="p" onclick="home()">Home</button>`;
}
let _idb;
const idb=()=>_idb||(_idb=new Promise((res,rej)=>{const r=indexedDB.open('examquiz',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
const kv=async(mode,fn)=>{const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('kv',mode),r=fn(t.objectStore('kv'));t.oncomplete=()=>res(r.result);t.onerror=()=>rej(t.error)})};
function mkcol(p){return{
  async get(){const keys=await kv('readonly',s=>s.getAllKeys()),vals=await kv('readonly',s=>s.getAll()),docs=[];keys.forEach((k,i)=>{if(String(k).startsWith(p+'/'))docs.push({id:String(k).slice(p.length+1),data:()=>vals[i]})});return{docs}},
  doc:id=>({async get(){const v=await kv('readonly',s=>s.get(p+'/'+id));return{exists:v!==undefined,data:()=>v}},async set(v){await kv('readwrite',s=>s.put(JSON.parse(JSON.stringify(v)),p+'/'+id))},async delete(){await kv('readwrite',s=>s.delete(p+'/'+id))}})}}
const KEY='examquiz_key',getKey=()=>localStorage.getItem(KEY)||'';
const PROV=()=>localStorage.getItem('examquiz_prov')||'gemini',MODEL=()=>localStorage.getItem('examquiz_model')||(PROV()==='gemini'?'gemini-3.5-flash':'claude-sonnet-5-5');
const b64=blob=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(blob)});
const sleep=ms=>new Promise(r=>setTimeout(r,ms));let lastCall=0;
function mkSample(){
  if(!getKey())return null;
  return{async json(prompt,o={}){
    const imgs=[];for(const b of(o.images||[]))imgs.push(await b64(b));
    const g=PROV()==='gemini';let t='';
    for(let a=0;a<4&&!t;a++){
      const w=lastCall+(g?4500:0)-Date.now();if(w>0)await sleep(w);lastCall=Date.now();
      const r=g?await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+MODEL()+':generateContent?key='+encodeURIComponent(getKey()),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt},...imgs.map(d=>({inline_data:{mime_type:'image/jpeg',data:d}}))]}],generationConfig:{responseMimeType:'application/json',maxOutputTokens:16000}})})
        :await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':getKey(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:MODEL(),max_tokens:12000,messages:[{role:'user',content:[...imgs.map(d=>({type:'image',source:{type:'base64',media_type:'image/jpeg',data:d}})),{type:'text',text:prompt}]}]})});
      if(r.status===429||r.status===503){await sleep(15000*(a+1));continue}
      const j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||r.status);
      t=g?((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(p=>p.text||'').join(''):j.content.map(c=>c.text||'').join('');
    }
    if(!t)throw new Error('No answer (limit reached?). Wait a few minutes or try tomorrow.');
    const m=t.replace(/```json|```/g,'').match(/\[[\s\S]*\]/);return JSON.parse(m?m[0]:t)}}
}
function saveKey(){localStorage.setItem(KEY,document.getElementById('ak').value.trim());localStorage.setItem('examquiz_model',document.getElementById('am').value.trim());sample=mkSample();toast('Saved')}
function setProv(p){localStorage.setItem('examquiz_prov',p);localStorage.removeItem('examquiz_model');settings()}
function settings(){
  const p=PROV();
  app.innerHTML=`<h1>Settings &amp; backup</h1>
  <div class="card"><h2>AI helper (needed for handwriting and for good questions)</h2>
  <p class="mut"><b>Free:</b> get a free Google Gemini key at aistudio.google.com → “Get API key”. No card needed. It has daily limits, and Google may use content sent on the free tier to improve its products. <b>Paid alternative:</b> a Claude key from console.anthropic.com. The key stays in this browser.</p>
  <div class="row"><button class="${p==='gemini'?'p':''}" onclick="setProv('gemini')">Gemini (free)</button><button class="${p==='claude'?'p':''}" onclick="setProv('claude')">Claude (paid)</button></div>
  <input type="text" id="ak" placeholder="Paste your ${p==='gemini'?'Gemini':'Claude'} API key" value="${esc(getKey())}" style="margin-top:10px">
  <input type="text" id="am" value="${esc(MODEL())}" style="margin-top:8px"><div class="mut">Model name (change only if it stops working)</div>
  <div class="row"><button class="p" onclick="saveKey()">Save</button></div></div>
  <div class="card"><h2>Backup</h2><p class="mut">Topics and progress live in this browser only. Export a backup regularly; Import restores it or moves it to another device.</p><div class="row"><button class="p" onclick="exportAll()">Export backup</button></div><p class="mut" style="margin:12px 0 4px">Import a backup file:</p><input type="file" id="imp" accept=".json" onchange="importAll(this.files[0])"></div><button onclick="home()">Back</button>`;
}
async function exportAll(){const keys=await kv('readonly',s=>s.getAllKeys()),vals=await kv('readonly',s=>s.getAll()),o={};keys.forEach((k,i)=>o[k]=vals[i]);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download='quiz-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
async function importAll(f){if(!f)return;try{const o=JSON.parse(await f.text());for(const k in o)await kv('readwrite',s=>s.put(o[k],k));topics={};for(const k in BANK)delete BANK[k];(await col.get()).docs.forEach(d=>topics[d.id]=d.data());home()}catch(e){console.error(e);toast('Import failed')}}
let OCRW=null;
async function ocrOf(src){
  if(!window.Tesseract)await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)});
  OCRW=OCRW||await Tesseract.createWorker('eng');
  const d=(await OCRW.recognize(src)).data;
  return(d.lines||[]).filter(l=>l.confidence>=75).map(l=>l.text.trim()).filter(Boolean);
}
async function pageLines(pg){
  const tc=await pg.getTextContent(),rows=[];
  tc.items.forEach(it=>{if(!it.str.trim())return;const y=Math.round(it.transform[5]),h=Math.abs(it.transform[3])||it.height;let r=rows.find(r=>Math.abs(r.y-y)<3);if(!r){r={y,h:0,t:[]};rows.push(r)}r.t.push([it.transform[4],it.str]);r.h=Math.max(r.h,h)});
  rows.sort((a,b)=>b.y-a.y);
  return rows.map(r=>({t:r.t.sort((a,b)=>a[0]-b[0]).map(x=>x[1]).join(' ').replace(/\s+/g,' ').trim(),h:r.h})).filter(r=>r.t);
}
const BUL=/^\s*(?:[•\u2022\u25AA\u25CF\u25E6·*\-–—]|\(?\d{1,3}[.)]|[a-z][.)])\s+/;
function assemble(lines,hint,fid){
  const hs=lines.filter(l=>l.h>0).map(l=>l.h).sort((a,b)=>a-b),mh=hs.length?hs[Math.floor(hs.length/2)]:0,nh=hint.map(x=>x.toLowerCase());
  let cur=fid?topics[fid].name:(hint.length===1?hint[0]:''),pend='';const by={};
  const junk=t=>{const w=t.match(/[A-Za-z]{3,}/g)||[];if(!w.length)return true;const bad=w.filter(x=>!/[aeiouyAEIOUY]/.test(x)&&x!==x.toUpperCase()).length;return bad/w.length>.3||t.replace(/[^A-Za-z]/g,'').length/t.length<.5};
  const flush=()=>{if(pend.trim().length>3&&!junk(pend)){const nm=cur||'Untitled',k=nm.toLowerCase();(by[k]=by[k]||{name:nm,facts:[]}).facts.push(pend.trim())}pend=''};
  for(const l of lines){
    const t=l.t;if(!t)continue;let head=null;
    if(!fid){const lc=t.toLowerCase().replace(/[:\-–\s]+$/,'');
      if(nh.length){const j=nh.findIndex(n=>t.length<80&&(lc===n||(lc.length<n.length+25&&lc.includes(n))));if(j>=0)head=hint[j]}
      else if(!BUL.test(t)&&t.length<70&&((mh&&l.h>mh*1.2)||(/:$/.test(t)&&t.length<50)||(t===t.toUpperCase()&&/[A-Z]{3}/.test(t)&&(t.length>=8||t.includes(' '))&&!/\d{3,}/.test(t))))head=t.replace(/[:\-–\s]+$/,'')}
    if(head){flush();cur=head;continue}
    if(BUL.test(t)){flush();pend=t.replace(BUL,'')}
    else if(pend&&(/^[a-z]/.test(t)||/[,(\-–:]$|\b(and|or|of|the|to|in|by)$/i.test(pend)))pend+=' '+t;
    else{flush();pend=t}
  }
  flush();return by;
}
async function localExtract(pages,hint,fid,st,ocr){
  const lines=[];let nskip=0;
  for(let i=0;i<pages.length&&!STOP;i++){
    const u=pages[i];st.textContent=`Reading page ${i+1} of ${pages.length}…`;
    try{
      if(u.text){u.text.split('\n').forEach(t=>lines.push({t:t.trim(),h:0}));continue}
      let L=[];
      if(u.pdf){const pg=await u.pdf.getPage(u.p);L=await pageLines(pg);
        if(L.map(l=>l.t).join('').length<40){
          if(!ocr){nskip++;continue}
          st.textContent=`Page ${i+1} is a scan, running OCR (slow)…`;const vp=pg.getViewport({scale:2}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;L=(await ocrOf(c)).map(t=>({t,h:0}))}}
      else{if(!ocr){nskip++;continue}L=(await ocrOf(u.file)).map(t=>({t,h:0}))}
      L.forEach(l=>lines.push(l));
    }catch(e){console.error(e)}
  }
  review(assemble(lines,hint,fid),nskip?[nskip+' scanned or handwritten page(s) were NOT read, because free OCR can’t read handwriting. Add a free Gemini key in Settings, then upload them again.']:[]);
}
let q='',STOP=0;
function home(){
  let h='<h1>🧠 Exam Quiz Trainer</h1>';
  if(!col)h+='<div class="warn">This browser is blocking storage, so topics will be lost when you close the page.</div>';
  h+='<div class="row" style="margin:0 0 12px"><button class="p" onclick="addView()">+ Upload notes</button><button onclick="settings()">Settings &amp; backup</button>'+(Object.values(topics).some(t=>(t.bk||0)<t.facts.length)?'<button onclick="build(Object.keys(topics))">Build questions for all topics</button>':'')+'</div>';
  const n=Object.keys(topics).length;
  if(n)h+=`<input type="text" id="sq" placeholder="Search ${n} topics…" value="${esc(q)}" oninput="q=this.value;lst()"><div id="lst" style="margin-top:12px"></div>`;
  else h+='<div class="card mut">No topics yet. Upload a PDF of your notes. It can contain several topics; they’ll be detected and listed here.</div>';
  app.innerHTML=h;lst();
}
function lst(){
  const el=document.getElementById('lst');if(!el)return;
  const ids=Object.keys(topics).filter(id=>topics[id].name.toLowerCase().includes(q.trim().toLowerCase())).sort((a,b)=>topics[a].name.localeCompare(topics[b].name));
  el.innerHTML=(ids.length?'':'<div class="mut">No match.</div>')+ids.map(id=>{const T=topics[id],n=T.facts.length,s=T.facts.reduce((a,f)=>a+f.s,0),c=T.facts.reduce((a,f)=>a+f.c,0),seen=T.facts.filter(f=>f.s).length;
    return `<div class="card"><h2>${esc(T.name)}</h2><div class="mut">${n} facts · ${seen} tested · accuracy ${s?Math.round(100*c/s)+'%':'–'} · questions ready ${T.bk||0}/${n}</div>
    <div class="row"><button class="p" onclick="setup('${id}')">Quiz</button>${(T.bk||0)<n?`<button onclick="build(['${id}'])">Build questions</button>`:''}<button onclick="addView('${id}')">Add notes</button><button onclick="del('${id}',this)">Delete</button></div></div>`}).join('');
}
async function del(id,b){if(!b.dataset.c){b.dataset.c=1;b.textContent='Tap again to delete';return}
  const T=topics[id];delete topics[id];delete BANK[id];
  if(col)try{await col.doc(id).delete();for(let k=0;k<(T.bn||0);k++)await bcol.doc(id+'_'+k).delete()}catch(e){}home()}
function addView(id){
  app.innerHTML=`<h1>${id?'Add notes to '+esc(topics[id].name):'Upload notes'}</h1>${sample?'':'<div class="warn">Handwritten notes need the AI helper. Add a free Gemini key in Settings first, or the facts will come out as garbage.</div>'}
  <p class="mut">Choose one or more PDFs (or photos). A PDF can hold several topics; they’re detected and split automatically. Keep this page open while it reads.</p>
  <input type="file" id="fl" accept="application/pdf,image/*" multiple>
  <p class="mut" style="margin:14px 0 4px">If the file button doesn’t open on your phone, copy the text from your PDF and paste it here instead:</p><textarea id="tx" style="min-height:140px" placeholder="Paste notes text here (one or many topics)"></textarea>
  ${id?'':'<p class="mut" style="margin:14px 0 4px">Optional: list the topics in this file, one per line, to help sort the facts.</p><textarea id="hint" placeholder="Naxalism&#10;Mission Karmayogi"></textarea>'}
  <label class="mut" style="display:block;margin-top:12px"><input type="checkbox" id="ocr"> Printed (not handwritten) scans: try free OCR</label>
  <div class="row"><button class="p" id="go" onclick="extract('${id||''}')">Extract facts</button><button id="stop" style="display:none" onclick="STOP=1">Stop &amp; keep what’s done</button><button onclick="home()">Cancel</button></div>
  <div id="st" class="mut" style="margin-top:12px"></div>`;
}
const shrink=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1800/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(r,'image/jpeg',.85)};i.src=URL.createObjectURL(f)});
async function extract(fid){
  const files=[...document.getElementById('fl').files],txt=document.getElementById('tx').value.trim();if(!files.length&&!txt){toast('Choose a file or paste text first');return}
  const hint=fid?[]:document.getElementById('hint').value.split('\n').map(x=>x.trim()).filter(Boolean);
  const st=document.getElementById('st');STOP=0;
  document.getElementById('go').disabled=true;document.getElementById('stop').style.display='';
  const pages=[];
  try{
    for(const f of files){
      if(f.type==='application/pdf'){
        if(!window.pdfjsLib)throw new Error('PDF reader did not load');
        pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
        for(let p=1;p<=pdf.numPages;p++)pages.push({pdf,p,label:f.name+' p'+p});
      }else pages.push({file:f,label:f.name});
    }

const STOPW=new Set('The A An In On At Of And For To By With From As It Its This That These Those He She They His Her Their After Before During Also Is Was Were Are Be Been Has Have Had Which Who Whom Not No Under Over Since Between'.split(' '));

const W={blank:30,recall:30,consider:12,order:17,correct:4,not:4,about:3};
const pickTypes=()=>Object.keys(W).map(k=>[k,-Math.log(Math.random())/W[k]]).sort((a,b)=>a[1]-b[1]).map(a=>a[0]);
const VERBS=/\s(is|was|are|were|has|have|had|means|refers to|known as|launched|started|began|founded|introduced|established|announced|signed|passed|declared|spans|covers|aims|commenced|adopted|merged|inaugurated|released|approved|awarded|appointed|elected|won|hosted|signed)\s/i;

let MODE='bank';

let TM=null;const TSEC=()=>{const v=localStorage.getItem('examquiz_t');return v===null?15:+v};

async function practice(id,n){
